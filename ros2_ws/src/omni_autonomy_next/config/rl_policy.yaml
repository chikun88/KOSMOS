# Deployed reinforcement-learning residual: EMPTY OVERRIDE TABLE.
#
# An empty table is bit-identical to the deterministic MPPI controller, so it is
# trivially non-regressing relative to that baseline. It does not prevent the
# baseline controller from colliding. Certification below is historical, from
# 2026-08-04, and does not certify the current sprint profile or tracker.
# 2026-10-07 final paired replay: 89/98 arrivals, 5 model contacts, 1 timeout,
# 3 progress aborts, zero paired regressions; the collision gate fails.
# See docs/SYSTEM_AUDIT_RL_20261007.json and docs/SYSTEM_AUDIT_20261007.md.
#
# Training on the rebuilt offline model (real ten-vertex footprint, deployed nav2
# gates) produced candidates that rescued *no* failing route and regressed
# routes that already worked.  A direct probe then showed why: holding each of
# the eight residual actions constant across the five failing goal pairs
# (1->2, 3->4, 5->4, 6->4, 7->4, six seeds each) never beat the deterministic
# baseline's 4/30 arrivals, and most scored 0/30.
#
#   baseline      4/30      0.50,1.60   0/30
#   0.35,1.60     0/30      0.50,1.00   1/30
#   0.35,1.00     0/30      0.70,1.40   0/30
#                           0.70,1.00   4/30
#
# The residual may only slow the controller or push it away from a wall.  In a
# 50 mm slot, slowing does not avoid the Collision Monitor brake -- it trips the
# progress checker instead, which is why every slower action is worse.
#
# The binding constraint is geometric.  Reaching goal 4 requires threading a
# slot whose best achievable footprint clearance is 49-59 mm from y=0.8 to
# y=1.4, and then stopping inside a 40 mm tolerance.  Goals 4 and 5 already sit
# at the clearance maximum of that slot, so no pose tweak within the declared
# +-0.10 m helps them; goals 6 and 7 could gain 100 mm and 31 mm respectively by
# moving to x=-0.910 and x=-0.890, which changes the shot standoff and is a
# mechanical decision.
#
# See docs/REINFORCEMENT_LEARNING.md.  Re-run `python3 run.py rl-train` after
# any change to the poses, footprint or nav2 gates. Nonempty tables also need
# matched runtime observation context before promotion/export: the current
# simulator observes model actual velocity, while this adapter observes the
# smoothed command. That mismatch blocks nonempty deployment. See
# docs/RL_DEPLOYMENT_CONTEXT_20261007.md.
